<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>实验室出入登记</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-main">
    <h1 id="title">实验室出入登记</h1>
    <p class="sub">
      <span id="clock">--:--</span>
      <span class="sep">·</span>
      <span id="present">0 人在场</span>
    </p>
  </div>
  <button id="viewToggle" class="ghost" type="button">今日记录</button>
</header>

<main>
  <p id="notice" class="notice" hidden></p>

  <section id="grid" class="grid" aria-label="人员签到"></section>

  <section id="recordsView" class="panel" hidden>
    <div class="panel-head">
      <h2>今日记录</h2>
      <button id="exportCsv" class="ghost small" type="button">导出 CSV</button>
    </div>
    <ul id="todayList" class="records"></ul>
  </section>
</main>

<footer class="footer">
  <span id="syncState" class="sync">已连接</span>
  <button id="refresh" class="ghost small" type="button">刷新</button>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
